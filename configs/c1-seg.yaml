# Training config: YOLO26-s-seg on the NASA C1 segmentation dataset.
# Batch 16 used for box models; seg runs peak above 16 GB VRAM and fall back
# to 8 automatically on a 16 GB card.
data: data/c1-full-seg/data.yaml
model: yolo26s-seg.pt
epochs: 15
imgsz: 1024
batch: 8
device: 0
project: runs
name: full-v1s-seg
seed: 42
workers: 4
exist_ok: true
